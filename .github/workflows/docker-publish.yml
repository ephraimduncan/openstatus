name: Publish Docker Images

on:
  push:
    branches:
      - fix/self-hosted-reliability
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            context: .
            dockerfile: apps/server/Dockerfile
          - service: dashboard
            context: .
            dockerfile: apps/dashboard/Dockerfile
          - service: workflows
            context: .
            dockerfile: apps/workflows/Dockerfile
          - service: private-location
            context: apps/private-location
            dockerfile: apps/private-location/Dockerfile
          - service: status-page
            context: .
            dockerfile: apps/status-page/Dockerfile
          - service: probe
            context: apps/checker
            dockerfile: apps/checker/private-location.Dockerfile
          - service: db-migrate
            context: .
            dockerfile: packages/db/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/openstatus-${{ matrix.service }}
          tags: type=sha,format=long,prefix=
          flavor: latest=false

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
